


[BDS Menu]

Indent = 1
FirstRow = 1







Label = "Exit BDS Menu"
App = Exit






Label = "Enable Secure Boot"
App = SecurityToggleApp
Arg = "/SecureBootEnable"






Label = "Disable Secure Boot"
App = SecurityToggleApp
Arg = /SecureBootDisable





Label = "Enable Debug Policy"
App = DebugPolicyToggleApp
Arg = "/DebugPolicyEnable"





Label = "Disable Debug Policy"
App = DebugPolicyToggleApp
Arg = "/DebugPolicyDisable"





Label = "Config PPI display"
App = DebugPolicyToggleApp
Arg = "/ConfigPpiDisplay"










Label = "Provision RPMB"
App = RPMBProvision
Arg = "-Prompt"






Label = "Enter Shell"
App = Shell
Arg = "-nomap -nostartup"






Label = "Boot USB First"
App = Cmd
Arg = "BootUSBFirst"






Label = "MassStorage"
App = UsbfnMsdApp
Arg = "MassStorage"




Label = "Reboot"
App = Cmd
Arg = "Reboot"




Label = "Shutdown"
App = Cmd
Arg = "Shutdown"



Label = "CLOCK Menu"
App = Menu
Arg = "Clock_Menu.cfg"


Label = "USB Menu"
App = Menu
Arg = "Usb_LA_Menu.cfg"


Label = "PMIC Menu"
App = Menu
Arg = "Pmic_Menu.cfg"


Label = "EUD Menu"
App = Menu
